name: tingpush
description: Flutter SDK for TingPush push notifications and incoming calls (CallKit on iOS, full-screen call UI on Android).
version: 1.1.0
repository: https://github.com/DaoChiMinh/tingpush-sdk/tree/main/flutter/tingpush
issue_tracker: https://github.com/DaoChiMinh/tingpush-sdk/issues
topics:
  - push-notifications
  - notifications
  - callkit
  - voip
  - firebase-messaging

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  device_info_plus: ^13.3.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_callkit_incoming: ^3.1.6
  http: ^1.6.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6

flutter:
  plugin:
    platforms:
      android:
        package: com.tingpush.flutter
        pluginClass: TingPushPlugin
      ios:
        pluginClass: TingPushPlugin
